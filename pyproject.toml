[project]
name = "running-coach"
version = "0.1.0"
description = "Analiza tus carreras del Amazfit y planifica entrenamientos con Claude"
readme = "README.md"
authors = [
    { name = "José Ignacio Martínez-Lozano Pérez", email = "nachomartinezlozanoperez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fitdecode>=0.11.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
coach = "running_coach.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
